<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPL + Upper / Lower</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #08080f; color: #e0e0f0; font-family: 'Segoe UI', sans-serif; direction: rtl; }
  .header { background: linear-gradient(160deg,#111128,#0d1f3c); padding: 24px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .header-inner { max-width: 620px; margin: 0 auto; }
  .eyebrow { font-size: 10px; color: #556; letter-spacing: 3px; margin-bottom: 6px; text-transform: uppercase; }
  h1 { margin: 0; font-size: 24px; font-weight: 900; color: #fff; }
  .badges { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 3px 12px; font-size: 11px; color: #bbb; }

  .tabs-wrap { overflow-x: auto; background: #0a0a16; padding: 14px 20px 0; }
  .tabs { display: flex; gap: 8px; max-width: 620px; margin: 0 auto; }
  .tab { flex: 0 0 auto; min-width: 84px; padding: 10px 12px; cursor: pointer; background: rgba(255,255,255,0.04); color: #666; border: 2px solid transparent; border-radius: 12px 12px 0 0; font-size: 12px; font-weight: 700; transition: all 0.2s; text-align: center; }
  .tab .emoji { font-size: 18px; margin-bottom: 3px; }
  .tab .sub { font-size: 9px; opacity: 0.75; margin-top: 1px; }
  .tab.active { color: #fff; }

  .content { max-width: 620px; margin: 0 auto; padding: 18px 20px 40px; }

  .day-info { border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .day-title { font-size: 18px; font-weight: 800; color: #fff; }
  .day-muscle { font-size: 11px; color: #777; margin-top: 4px; }
  .new-count { margin-top: 6px; font-size: 11px; }
  .pct { font-size: 26px; font-weight: 900; text-align: center; }
  .pct-sub { font-size: 10px; color: #555; text-align: center; }

  .progress-bar-outer { background: rgba(255,255,255,0.06); border-radius: 100px; height: 5px; overflow: hidden; margin-bottom: 18px; }
  .progress-bar-inner { height: 100%; border-radius: 100px; transition: width 0.4s; }

  .exercises { display: flex; flex-direction: column; gap: 8px; }
  .exercise { border-radius: 13px; padding: 13px 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.03); }
  .checkbox { width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .checkbox .mark { color: #fff; font-size: 12px; font-weight: 900; display: none; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ex-name { font-size: 14px; font-weight: 700; color: #fff; }
  .ex-tag-new { font-size: 9px; border-radius: 6px; padding: 1px 6px; font-weight: 700; }
  .ex-muscle { font-size: 10px; color: #556; margin-top: 3px; }
  .ex-sets { flex-shrink: 0; }
  .ex-sets-inner { border-radius: 8px; padding: 5px 10px; text-align: center; }
  .ex-sets-val { font-size: 13px; font-weight: 800; }

  .legend { margin-top: 24px; display: flex; gap: 16px; align-items: center; padding: 12px 14px; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); }
  .legend-star { font-size: 12px; font-weight: 700; }
  .legend-text { font-size: 11px; color: #555; }

  .tips-title { font-size: 11px; color: #444; letter-spacing: 2px; text-transform: uppercase; margin: 28px 0 12px; }
  .tips-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tip { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; }
  .tip-icon { font-size: 18px; margin-bottom: 5px; }
  .tip-title { font-size: 12px; font-weight: 700; color: #ddd; margin-bottom: 3px; }
  .tip-body { font-size: 11px; color: #555; line-height: 1.5; }

  .warning-box { margin-top: 20px; padding: 14px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-size: 11px; color: #444; text-align: center; line-height: 1.8; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="eyebrow">نظام تدريبي محدّث ومتكامل</div>
    <h1>PPL + Upper / Lower</h1>
    <div class="badges">
      <span class="badge">🎯 بناء عضل + حرق دهون</span>
      <span class="badge">📅 5 أيام / أسبوع</span>
      <span class="badge">✅ كل العضلات مغطّاة</span>
    </div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs"></div>
</div>

<div class="content">
  <div class="day-info" id="dayInfo"></div>
  <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
  <div class="exercises" id="exercises"></div>

  <div class="legend">
    <span class="legend-star" id="legendStar">✨ جديد</span>
    <span class="legend-text">= تمارين مضافة لتغطية العضلات الغائبة سابقاً</span>
  </div>

  <div class="tips-title">نصائح مهمة</div>
  <div class="tips-grid" id="tipsGrid"></div>

  <div class="warning-box">
    ⚠️ الأسبوعين الأولين ابدأ بـ 70-80% من قوتك الحقيقية<br>جسمك يحتاج يتكيّف بعد الانقطاع قبل ما تضغط بالكامل
  </div>
</div>

<script>
const plan = {
  days: [
    {
      day: "الأحد", label: "Push", emoji: "🔥", color: "#FF6B35",
      muscle: "Chest · Shoulders · Triceps",
      exercises: [
        { name: "Bench Press", sets: "4", reps: "8-10", muscle: "Chest – Sternal (Mid)", note: "" },
        { name: "Incline Dumbbell Press", sets: "3", reps: "10-12", muscle: "Chest – Clavicular (Upper)", note: "" },
        { name: "Decline Press / Chest Dips", sets: "3", reps: "10-12", muscle: "Chest – Costal (Lower)", note: "❗ الصدر السفلي" },
        { name: "Cable Fly (Low-to-High)", sets: "3", reps: "12-15", muscle: "Chest – Serratus Anterior", note: "تمدد كامل" },
        { name: "Overhead Press (Barbell)", sets: "3", reps: "10-12", muscle: "Anterior Deltoid", note: "" },
        { name: "Lateral Raise", sets: "4", reps: "15-20", muscle: "Medial Deltoid", note: "وزن خفيف" },
        { name: "Tricep Pushdown (Rope)", sets: "3", reps: "12-15", muscle: "Triceps – Lateral Head", note: "" },
        { name: "Overhead Tricep Extension", sets: "3", reps: "12-15", muscle: "Triceps – Long Head", note: "" },
        { name: "Reverse Grip Pushdown", sets: "3", reps: "15", muscle: "Triceps – Medial Head", note: "❗ الرأس الخفي" },
      ],
    },
    {
      day: "الاثنين", label: "Pull", emoji: "💪", color: "#4ECDC4",
      muscle: "Back · Biceps · Traps · Rotator Cuff",
      exercises: [
        { name: "Deadlift", sets: "4", reps: "6-8", muscle: "Erector Spinae + Full Back", note: "الأساسية الكبرى" },
        { name: "Pull-up / Lat Pulldown", sets: "4", reps: "8-10", muscle: "Latissimus Dorsi", note: "" },
        { name: "Seated Cable Row", sets: "3", reps: "10-12", muscle: "Rhomboids + Mid Traps", note: "" },
        { name: "Dumbbell Row", sets: "3", reps: "10-12", muscle: "Teres Major + Lats", note: "كل جانب" },
        { name: "Face Pull", sets: "4", reps: "15-20", muscle: "Posterior Deltoid + Lower Traps", note: "صحة الكتف" },
        { name: "Barbell Shrug", sets: "3", reps: "12-15", muscle: "Upper Traps", note: "❗ ما كان موجود" },
        { name: "Barbell Curl", sets: "3", reps: "10-12", muscle: "Biceps – Long Head (Outer)", note: "" },
        { name: "Preacher Curl / Concentration Curl", sets: "3", reps: "12-15", muscle: "Biceps – Short Head (Inner)", note: "❗ الرأس الداخلي" },
        { name: "Hammer Curl", sets: "3", reps: "12-15", muscle: "Brachialis", note: "" },
        { name: "Reverse Curl", sets: "2", reps: "12-15", muscle: "Brachioradialis", note: "❗ ما كان موجود" },
        { name: "External Rotation (Cable)", sets: "2", reps: "15", muscle: "Rotator Cuff (Infraspinatus)", note: "❗ صحة الكتف طويل المدى" },
        { name: "Wrist Curl (Barbell)", sets: "3", reps: "15-20", muscle: "Forearms – Flexors (Inner)", note: "❗ ساعد داخلي" },
        { name: "Reverse Wrist Curl", sets: "3", reps: "15-20", muscle: "Forearms – Extensors (Outer)", note: "❗ ساعد خارجي" },
      ],
    },
    {
      day: "الثلاثاء", label: "Legs", emoji: "🦵", color: "#A855F7",
      muscle: "Quads · Hamstrings · Glutes · Calves · Adductors",
      exercises: [
        { name: "Squat", sets: "4", reps: "8-10", muscle: "Quads + Glutes", note: "الأساسية الكبرى" },
        { name: "Romanian Deadlift", sets: "3", reps: "10-12", muscle: "Hamstrings + Glutes", note: "" },
        { name: "Leg Press", sets: "3", reps: "12-15", muscle: "Quads – Vastus Lateralis", note: "" },
        { name: "Leg Curl (Machine)", sets: "3", reps: "12-15", muscle: "Hamstrings – Biceps Femoris", note: "" },
        { name: "Leg Extension", sets: "3", reps: "15-20", muscle: "Quads – Vastus Medialis (Teardrop)", note: "" },
        { name: "Hip Thrust", sets: "3", reps: "12-15", muscle: "Gluteus Maximus", note: "" },
        { name: "Hip Adduction (Machine)", sets: "3", reps: "15-20", muscle: "Adductors (Inner Thigh)", note: "❗ ما كان موجود" },
        { name: "Hip Abduction (Machine)", sets: "3", reps: "15-20", muscle: "Abductors + Gluteus Medius", note: "❗ ما كان موجود" },
        { name: "Standing Calf Raise", sets: "4", reps: "15-20", muscle: "Gastrocnemius", note: "" },
        { name: "Seated Calf Raise", sets: "3", reps: "20", muscle: "Soleus (Deep Calf)", note: "" },
      ],
    },
    {
      day: "الأربعاء", label: "Upper", emoji: "⚡", color: "#F59E0B",
      muscle: "Chest · Back · Shoulders · Core – Obliques",
      exercises: [
        { name: "Incline Barbell Press", sets: "4", reps: "6-8", muscle: "Chest – Clavicular (Heavy)", note: "ثقيل" },
        { name: "Weighted Pull-up", sets: "4", reps: "6-8", muscle: "Lats + Teres Major", note: "أضف وزن" },
        { name: "Arnold Press", sets: "3", reps: "10-12", muscle: "All 3 Deltoid Heads", note: "" },
        { name: "Cable Row (Wide Grip)", sets: "3", reps: "10-12", muscle: "Rhomboids + Rear Delt", note: "" },
        { name: "Chest Dips (Weighted)", sets: "3", reps: "8-10", muscle: "Chest Lower + Triceps", note: "" },
        { name: "Rear Delt Fly (Dumbbell)", sets: "3", reps: "15", muscle: "Posterior Deltoid", note: "" },
        { name: "Cable Woodchop / Pallof Press", sets: "3", reps: "12-15", muscle: "Obliques + Transverse Abdominis", note: "❗ المعدة الجانبية" },
        { name: "Plank", sets: "3", reps: "40s", muscle: "Transverse Abdominis + Core Stability", note: "❗ العمق والثبات" },
        { name: "Ab Wheel Rollout", sets: "3", reps: "10-12", muscle: "Rectus Abdominis + Core", note: "" },
        { name: "Farmer's Walk", sets: "3", reps: "30s", muscle: "Forearms – Grip Strength + Full Core", note: "❗ قوة القبضة والثبات" },
      ],
    },
    {
      day: "الخميس", label: "Lower + Abs", emoji: "🏋️", color: "#10B981",
      muscle: "Quads · Hamstrings · Glutes · Abs – Full",
      exercises: [
        { name: "Hack Squat / Front Squat", sets: "4", reps: "8-10", muscle: "Quads – Vastus Lateralis + Rectus Femoris", note: "" },
        { name: "Bulgarian Split Squat", sets: "3", reps: "10-12", muscle: "Quads + Glutes (Unilateral)", note: "كل رجل" },
        { name: "Nordic Curl / Leg Curl", sets: "3", reps: "8-10", muscle: "Hamstrings – Semimembranosus", note: "" },
        { name: "Glute Kickback (Cable)", sets: "3", reps: "15", muscle: "Gluteus Maximus", note: "كل رجل" },
        { name: "Goblet Squat", sets: "3", reps: "15", muscle: "Quads + Adductors", note: "خفيف – كمّلة" },
        { name: "Cable Crunch", sets: "3", reps: "15", muscle: "Rectus Abdominis (Upper)", note: "" },
        { name: "Hanging Leg Raise", sets: "3", reps: "15", muscle: "Rectus Abdominis (Lower)", note: "❗ السفلي" },
        { name: "Russian Twist (Weighted)", sets: "3", reps: "20", muscle: "Obliques – Internal + External", note: "❗ المعدة الجانبية" },
        { name: "Side Plank", sets: "3", reps: "30s", muscle: "Quadratus Lumborum + Obliques", note: "❗ كل جانب" },
      ],
    },
  ],
};

const tips = [
  { icon: "🍽️", t: "البروتين", b: "2 جرام لكل كيلو. بدونه ما يكبر العضل." },
  { icon: "📈", t: "Progressive Overload", b: "زيد وزن أو ريبة كل أسبوع." },
  { icon: "😴", t: "النوم", b: "7-9 ساعات. العضل يكبر وأنت نايم." },
  { icon: "⏱️", t: "الراحة بين السيتات", b: "60-90 ث عزل | 2-3 د أساسية." },
  { icon: "💧", t: "الماء", b: "3-4 لتر يومياً خصوصاً أيام التمرين." },
  { icon: "🔄", t: "الجمعة والسبت", b: "راحة تامة أو مشي خفيف فقط." },
];

let activeDay = 0;
let checked = {}; // key: "dayIdx-exIdx" -> bool

function hex2(color, alpha) {
  return color + alpha;
}

function render() {
  renderTabs();
  renderDayInfo();
  renderProgress();
  renderExercises();
  renderLegend();
  renderTips();
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  plan.days.forEach((d, i) => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (i === activeDay ? ' active' : '');
    if (i === activeDay) {
      btn.style.background = d.color;
      btn.style.borderColor = d.color;
      btn.style.boxShadow = `0 0 20px ${d.color}55`;
    }
    btn.innerHTML = `<div class="emoji">${d.emoji}</div><div>${d.day}</div><div class="sub">${d.label}</div>`;
    btn.onclick = () => { activeDay = i; render(); };
    tabsEl.appendChild(btn);
  });
}

function renderDayInfo() {
  const current = plan.days[activeDay];
  const done = current.exercises.filter((_, i) => checked[`${activeDay}-${i}`]).length;
  const pct = Math.round((done / current.exercises.length) * 100);
  const newExercises = current.exercises.filter(e => e.note.includes("❗"));

  const el = document.getElementById('dayInfo');
  el.style.background = `linear-gradient(135deg,${current.color}1a,${current.color}08)`;
  el.style.border = `1px solid ${current.color}33`;

  let newCountHtml = '';
  if (newExercises.length > 0) {
    newCountHtml = `<div class="new-count" style="color:${current.color}">✨ ${newExercises.length} تمرين جديد مضاف لهذا اليوم</div>`;
  }

  el.innerHTML = `
    <div>
      <div class="day-title">${current.emoji} ${current.day} — ${current.label}</div>
      <div class="day-muscle">${current.muscle}</div>
      ${newCountHtml}
    </div>
    <div>
      <div class="pct" style="color:${current.color}">${pct}%</div>
      <div class="pct-sub">${done}/${current.exercises.length}</div>
    </div>
  `;
}

function renderProgress() {
  const current = plan.days[activeDay];
  const done = current.exercises.filter((_, i) => checked[`${activeDay}-${i}`]).length;
  const pct = Math.round((done / current.exercises.length) * 100);
  const bar = document.getElementById('progressBar');
  bar.style.width = pct + '%';
  bar.style.background = current.color;
}

function renderExercises() {
  const current = plan.days[activeDay];
  const wrap = document.getElementById('exercises');
  wrap.innerHTML = '';
  current.exercises.forEach((ex, i) => {
    const k = `${activeDay}-${i}`;
    const isDone = !!checked[k];
    const isNew = ex.note.includes("❗");

    const row = document.createElement('div');
    row.className = 'exercise';
    row.style.background = isDone ? `${current.color}15` : isNew ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.03)';
    row.style.border = `1px solid ${isDone ? current.color + '44' : isNew ? current.color + '33' : 'rgba(255,255,255,0.07)'}`;
    row.style.opacity = isDone ? '0.6' : '1';
    row.onclick = () => { checked[k] = !checked[k]; render(); };

    const newTag = isNew ? `<span class="ex-tag-new" style="background:${current.color}33;color:${current.color}">جديد</span>` : '';

    row.innerHTML = `
      <div class="checkbox" style="background:${isDone ? current.color : 'transparent'};border-color:${isDone ? current.color : 'rgba(255,255,255,0.15)'}">
        <span class="mark" style="display:${isDone ? 'inline' : 'none'}">✓</span>
      </div>
      <div class="ex-info">
        <div class="ex-name-row">
          <div class="ex-name" style="color:${isDone ? '#777' : '#fff'};text-decoration:${isDone ? 'line-through' : 'none'}">${ex.name}</div>
          ${newTag}
        </div>
        <div class="ex-muscle">${ex.muscle}</div>
      </div>
      <div class="ex-sets">
        <div class="ex-sets-inner" style="background:${current.color}1a;border:1px solid ${current.color}33">
          <div class="ex-sets-val" style="color:${current.color}">${ex.sets} × ${ex.reps}</div>
        </div>
      </div>
    `;
    wrap.appendChild(row);
  });
}

function renderLegend() {
  const current = plan.days[activeDay];
  document.getElementById('legendStar').style.color = current.color;
}

function renderTips() {
  const grid = document.getElementById('tipsGrid');
  grid.innerHTML = '';
  tips.forEach(tip => {
    const div = document.createElement('div');
    div.className = 'tip';
    div.innerHTML = `
      <div class="tip-icon">${tip.icon}</div>
      <div class="tip-title">${tip.t}</div>
      <div class="tip-body">${tip.b}</div>
    `;
    grid.appendChild(div);
  });
}

render();
</script>
</body>
</html>
